  <body>
    <div id="game">
      <main id="screen" class="screen boot-screen">
        <section class="boot-card">

    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
    <script type="module">
      import('./src/main.js?build=epic7').catch((error) => {
        console.error(error);
        const screen = document.querySelector('#screen');
        if (screen)
          screen.innerHTML =
            '<section class="boot-card error-card"><h1>Oups !</h1><p>Le jeu n’a pas pu démarrer. Recharge la page pour réessayer.</p><button onclick="location.reload()">Recharger</button></section>';
      });
    </script>
