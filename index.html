<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d24" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="preload" href="./fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      const params = new URLSearchParams(location.search),
        urlLanguage = params.get('lang');
      if (urlLanguage === 'en' || urlLanguage === 'fr') document.documentElement.lang = urlLanguage;
      try {
        const saved = JSON.parse(localStorage.getItem('arene-de-noam-save') || 'null'),
          root = document.documentElement,
          language = urlLanguage === 'en' || urlLanguage === 'fr' ? urlLanguage : saved?.language;
        if (saved?.reducedMotion) root.classList.add('reduced-motion');
        if (saved?.highContrast) root.classList.add('high-contrast');
        if (language === 'en' || language === 'fr') root.lang = language;
      } catch {}
      // The shown language's dictionary is its own module (src/i18n.js): fetch it beside the app
      // instead of after it. tools/build.mjs rewrites both paths to their hashed chunks.
      {
        const dictionary = document.createElement('link');
        dictionary.rel = 'modulepreload';
        dictionary.href = document.documentElement.lang === 'en' ? './src/i18n/en.js' : './src/i18n/fr.js';
        document.head.append(dictionary);
      }
    </script>
    <title>Arène de Noam</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/screens/progression.css" />
    <link rel="stylesheet" href="./styles/screens/draft.css" />
    <link rel="stylesheet" href="./styles/screens/accessibility.css" />
    <link rel="stylesheet" href="./styles/screens/league.css" />
    <link rel="stylesheet" href="./styles/screens/bestiary.css" />
    <link rel="stylesheet" href="./styles/screens/selection.css" />
    <link rel="stylesheet" href="./styles/screens/gauntlet.css" />
    <link rel="stylesheet" href="./styles/overrides/academy.css" />
    <link rel="stylesheet" href="./styles/screens/results.css" />
    <!-- Battle-sheet asset manifest; ctx.ensureBattleStyles() promotes these
         paths (src/app/battle-stylesheets.js, with their cascade anchors) only
         when selection or a battle-adjacent screen is opened. Keeping the
         manifest here lets tooling validate every move choreography without
         making the title load the battle CSS. tools/build.mjs replaces the
         stylesheet links and this manifest with hashed bundles in dist/. -->
    <!-- href="./styles/screens/battle-fx.css" -->
    <!-- href="./styles/screens/battle-presentation.css" -->
    <!-- href="./styles/screens/battle-combos.css" -->
    <!-- href="./styles/screens/battle-ace-log.css" -->
    <!-- href="./styles/overrides/battle-moves.css" -->
    <!-- href="./styles/overrides/battle-command.css" -->
    <!-- href="./styles/overrides/battle-preview.css" -->
    <!-- href="./styles/screens/battle-layout.css" -->
  </head>
  <body>
    <script>
      try {
        const root = document.documentElement,
          body = document.body;
        body.classList.toggle('reduced-motion', root.classList.contains('reduced-motion'));
        body.classList.toggle('high-contrast', root.classList.contains('high-contrast'));
      } catch {}
    </script>
    <script>
      // Press feedback follows the finger at once: Chrome for Android applies
      // :active only after its tap timeout, so the pressed button also gets
      // `.is-pressed` from pointerdown until release (or until a scroll takes over).
      {
        let pressed = null;
        const release = () => {
          pressed?.classList.remove('is-pressed');
          pressed = null;
        };
        const options = { capture: true, passive: true };
        addEventListener(
          'pointerdown',
          (event) => {
            release();
            if (!event.isPrimary || event.button !== 0) return;
            pressed =
              event.target.closest?.('button:not(:disabled), [role="button"]:not([aria-disabled="true"])') ??
              null;
            pressed?.classList.add('is-pressed');
          },
          options
        );
        for (const type of ['pointerup', 'pointercancel', 'dragstart'])
          addEventListener(type, release, options);
      }
    </script>
    <div id="game">
      <main id="screen" class="screen boot-screen">
        <section class="boot-card">
          <span class="brand-glyph" aria-hidden="true">✦</span>
          <h1>Arène de Noam</h1>
          <p>Ouverture des portes de l’arène…</p>
        </section>
      </main>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
    <script type="module">
      import('./src/main.js').catch((error) => {
        console.error(error);
        const screen = document.querySelector('#screen');
        if (screen)
          screen.innerHTML =
            '<section class="boot-card error-card"><h1>Oups !</h1><p>Le jeu n’a pas pu démarrer. Recharge la page pour réessayer.</p><button onclick="location.reload()">Recharger</button></section>';
      });
    </script>
  </body>
</html>
