<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#090b22" />
    <script>
      try {
        const params = new URLSearchParams(location.search),
          saved = JSON.parse(localStorage.getItem('arene-de-noam-save') || 'null'),
          root = document.documentElement,
          urlLanguage = params.get('lang'),
          language = urlLanguage === 'en' || urlLanguage === 'fr' ? urlLanguage : saved?.language;
        if (saved?.reducedMotion) root.classList.add('reduced-motion');
        if (saved?.highContrast) root.classList.add('high-contrast');
        if (language === 'en' || language === 'fr') document.documentElement.lang = language;
      } catch {}
    </script>
    <title>Arène de Noam</title>
    <link rel="stylesheet" href="./styles/tokens.css?build=epic7" />
    <link rel="stylesheet" href="./styles/base.css?build=epic7" />
    <link rel="stylesheet" href="./styles/components.css?build=epic7" />
    <link rel="stylesheet" href="./styles/screens/progression.css?build=epic7" />
    <link rel="stylesheet" href="./styles/screens/draft.css?build=epic7" />
    <link rel="stylesheet" href="./styles/screens/accessibility.css?build=epic7" />
    <link rel="stylesheet" href="./styles/screens/league.css?build=epic7" />
    <link rel="stylesheet" href="./styles/screens/bestiary.css?build=epic7" />
    <link rel="stylesheet" href="./styles/screens/selection.css?build=epic7" />
    <link rel="stylesheet" href="./styles/screens/gauntlet.css?build=epic7" />
    <link rel="stylesheet" href="./styles/overrides/selection.css?build=epic7" />
    <link rel="stylesheet" href="./styles/overrides/academy.css?build=epic7" />
    <link rel="stylesheet" href="./styles/screens/results.css?build=epic7" />
    <!-- Battle-only sheets are preloaded here and promoted to real stylesheets
         on first battle entry or move-theater preview (ctx.ensureBattleStyles),
         keeping the title screen's critical CSS small. -->
    <link rel="preload" as="style" href="./styles/screens/battle-fx.css?build=epic7" />
    <link rel="preload" as="style" href="./styles/screens/battle-presentation.css?build=epic7" />
    <link rel="preload" as="style" href="./styles/screens/battle-combos.css?build=epic7" />
    <link rel="preload" as="style" href="./styles/screens/battle-ace-log.css?build=epic7" />
    <link rel="preload" as="style" href="./styles/overrides/battle-moves.css?build=epic7" />
    <link rel="preload" as="style" href="./styles/overrides/battle-command.css?build=epic7" />
    <link rel="preload" as="style" href="./styles/overrides/battle-preview.css?build=epic7" />
    <link rel="preload" as="style" href="./styles/screens/battle-layout.css?build=epic7" />
  </head>
  <body>
    <div id="game">
      <main id="screen" class="screen boot-screen">
        <section class="boot-card">
          <span class="brand-glyph" aria-hidden="true">✦</span>
          <h1>Arène de Noam</h1>
          <p>Ouverture des portes de l’arène…</p>
        </section>
      </main>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
    <script type="module">
      import('./src/main.js?build=epic7').catch((error) => {
        console.error(error);
        const screen = document.querySelector('#screen');
        if (screen)
          screen.innerHTML =
            '<section class="boot-card error-card"><h1>Oups !</h1><p>Le jeu n’a pas pu démarrer. Recharge la page pour réessayer.</p><button onclick="location.reload()">Recharger</button></section>';
      });
    </script>
  </body>
</html>
